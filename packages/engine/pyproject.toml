[project]
name = "engine"
version = "0.1.0"
description = "The game engine running our game using the robotarium"
readme = "README.md"
authors = [
    { name = "N8BWert", email = "n8.wert.b@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cvxopt==1.3.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "protobuf>=7.36.2",
    "pyqt5>=5.15.11",
    "robotarium_python_simulator",
    "common"
]

[project.scripts]
engine = "engine:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
