[project]
name = "llm-mas-control"
version = "0.1.0"
description = "An investigation into using LLMs for control of multi-agent systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.uv.sources]
common = { workspace = true }
engine = { workspace = true }
gui-common = { workspace = true }
gui-rts = { workspace = true }
gui-llm = { workspace = true }
robotarium_python_simulator = { git = "https://github.com/robotarium/robotarium_python_simulator.git" }
# For the robotarium computer
# robotarium_python_simulator = { path = "/ws/src/robotarium_python_backend/robotarium_python_simulator" }

[tool.uv.workspace]
members = [
    "packages/*",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=9.1.1",
]
